name: ml_automation_workflow

on:
    push:
        branches: [ main ]

jobs:
    image-build:
        runs-on: ubuntu-latest
        steps:
          - name: Checkout Code
            uses: actions/checkout@v3

          - name: Login to Docker Hub
            run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

          - name: Build Image
            run: docker build -t ${{ secrets.DOCKER_USERNAME }}/ml_automation .

          - name: Push Image
            run: docker push ${{ secrets.DOCKER_USERNAME }}/ml_automation

        