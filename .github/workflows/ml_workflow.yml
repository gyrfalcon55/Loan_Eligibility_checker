name: ml_automation_workflow

on:
    workflow_dispatch:

jobs:
    image-build:
        runs-on: ubuntu-latest
        steps:
          - name: Build Docker Image
            run: |
              docker build -t ml_automation -f Dockerfile
        
    image-run:
        runs-on: ubuntu-latest
        needs: image-build
        steps:
          - name: Run Docker Container
            run: |
              docker run -d -p 5000:5000 --name my_cont  ml_automation