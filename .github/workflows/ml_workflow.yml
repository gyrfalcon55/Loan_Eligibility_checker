name: ml_automation_workflow

on:
    workflow_dispatch:

jobs:
    image-build:
        runs-on: ubuntu-latest
        steps:
          - name: Checkout Code
            uses: actions/checkout@v3
            
          - name: Build Docker Image
            run: |
              docker build -t ml_automation -f Dockerfile .

          - name: Run Docker Container
            run: |
              docker run -d -p 5000:5000 --name my_cont  ml_automation